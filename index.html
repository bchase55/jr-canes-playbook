<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jr Canes Red 7/8 — Play Editor</title>
<style>
:root{
  --ink:#0E1319; --panel:#161D26; --panel2:#1D2631; --edge:#2C3744;
  --txt:#E8EDF3; --dim:#8795A6; --red:#D02B34; --gold:#E8B23A;
  --rail:280px; --insp:264px;
  --cond:"Arial Narrow","Helvetica Neue Condensed","Roboto Condensed",system-ui,sans-serif;
  --ui:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--txt);font-family:var(--ui);font-size:13px;overflow:hidden}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr var(--insp);height:100vh}
.rail,.insp{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.rail{border-right:1px solid var(--edge)}
.insp{border-left:1px solid var(--edge)}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}

/* ---------- rail ---------- */
.brand{padding:16px 14px 12px;border-bottom:1px solid var(--edge)}
.brand h1{margin:0;font-family:var(--cond);font-stretch:condensed;font-size:19px;letter-spacing:.10em;
  text-transform:uppercase;line-height:1.15}
.brand h1 em{font-style:normal;color:var(--red)}
.brand p{margin:5px 0 0;color:var(--dim);font-size:11px;letter-spacing:.05em}
.railhd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px}
.railhd span{font-family:var(--cond);font-stretch:condensed;text-transform:uppercase;letter-spacing:.14em;
  font-size:11px;color:var(--dim)}
.plist{flex:1;overflow-y:auto;padding:0 8px 10px}
.pcard{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:center;width:100%;text-align:left;
  padding:7px 8px;border-radius:7px;border:1px solid transparent;margin-bottom:2px}
.pcard:hover{background:var(--panel2)}
.pcard.on{background:var(--panel2);border-color:var(--red)}
.pcard .num{font-family:var(--mono);font-size:10px;color:var(--dim);width:16px;text-align:right}
.pcard.on .num{color:var(--red)}
.pthumb{width:56px;height:32px;background:#fff;border-radius:3px;flex:none}
.pmeta{min-width:0}
.pname{font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptag{display:flex;gap:5px;align-items:center;margin-top:3px}
.chip{font-family:var(--mono);font-size:9px;letter-spacing:.06em;padding:1px 4px;border-radius:3px;
  background:#0c1117;color:var(--dim)}
.chip.link{color:var(--gold)}
.pcard .row2{display:flex;gap:8px;align-items:center;min-width:0}

/* ---------- toolbar ---------- */
.bar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--edge);
  background:var(--panel);flex-wrap:wrap}
.tbtn{padding:6px 10px;border-radius:6px;border:1px solid var(--edge);background:var(--panel2);
  color:var(--txt);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:12px}
.tbtn:hover:not(:disabled){border-color:var(--gold);color:#fff}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn.hot{background:var(--red);border-color:var(--red);color:#fff}
.tbtn.hot:hover{border-color:#fff}
.sep{width:1px;height:22px;background:var(--edge);margin:0 3px}
.grow{flex:1}
.namein{background:#0c1117;border:1px solid var(--edge);border-radius:6px;padding:7px 10px;
  font-family:var(--cond);font-stretch:condensed;font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  min-width:220px;flex:1;max-width:420px}
.namein:focus{border-color:var(--gold);outline:none}
.menu{position:relative}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:var(--panel2);
  border:1px solid var(--edge);border-radius:8px;padding:5px;min-width:190px;
  box-shadow:0 14px 34px rgba(0,0,0,.55)}
.pop.right{left:auto;right:0}
.pop button{display:flex;width:100%;text-align:left;padding:7px 9px;border-radius:5px;gap:9px;align-items:center}
.pop button:hover{background:var(--red)}
.pop hr{border:0;border-top:1px solid var(--edge);margin:5px 2px}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid;flex:none}
.dot.sq{border-radius:2px}

/* ---------- canvas ---------- */
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px;
  background:radial-gradient(circle at 50% 0%,#18212C,var(--ink) 70%)}
.field{width:100%;max-width:1000px;aspect-ratio:720/405;background:#fff;border-radius:8px;
  box-shadow:0 18px 50px rgba(0,0,0,.55);touch-action:none;display:block}
.hint{padding:7px 14px;border-top:1px solid var(--edge);color:var(--dim);font-size:11px;background:var(--panel);
  display:flex;gap:16px;flex-wrap:wrap}
.hint b{color:var(--txt);font-weight:600}

/* svg bits */
.o-body{cursor:grab}
.dragging .o-body{cursor:grabbing}
.sel-ring{fill:none;stroke:var(--red);stroke-width:2.2;stroke-dasharray:5 4;pointer-events:none}
.handle{fill:#fff;stroke:var(--gold);stroke-width:2;cursor:move}
.handle:hover{fill:var(--gold)}
.hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
.dlabel{cursor:grab}
.guide{stroke:#c9d4e0;stroke-width:1;stroke-dasharray:6 6}

/* ---------- inspector ---------- */
.insphd{padding:13px 14px 9px;border-bottom:1px solid var(--edge);font-family:var(--cond);
  font-stretch:condensed;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--dim)}
.inspbody{flex:1;overflow-y:auto;padding:12px 14px 20px}
.empty{color:var(--dim);font-size:12px;line-height:1.6}
.fld{margin-bottom:13px}
.fld>label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  margin-bottom:5px;font-family:var(--cond);font-stretch:condensed}
.inp,select.inp{width:100%;background:#0c1117;border:1px solid var(--edge);border-radius:6px;padding:7px 9px}
.inp:focus{border-color:var(--gold);outline:none}
.seg{display:flex;gap:4px}
.seg button{flex:1;padding:7px 4px;border:1px solid var(--edge);border-radius:6px;background:#0c1117;
  font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.seg button.on{background:var(--red);border-color:var(--red);color:#fff}
.rt{border:1px solid var(--edge);border-radius:8px;padding:10px;margin-bottom:9px;background:#0c1117}
.rt .rthd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rt .rthd em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim)}
.mini{padding:4px 7px;border:1px solid var(--edge);border-radius:5px;font-size:11px;background:var(--panel2)}
.mini:hover{border-color:var(--gold)}
.mini.dang:hover{border-color:var(--red);color:var(--red)}
.wide{width:100%;justify-content:center;display:flex}
.linkbox{background:#0c1117;border:1px solid var(--edge);border-left:3px solid var(--gold);
  border-radius:6px;padding:9px 10px;margin-bottom:13px;font-size:11px;line-height:1.5;color:var(--dim)}
.linkbox b{color:var(--gold);font-weight:600}
.linkbox .acts{display:flex;gap:6px;margin-top:8px}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--panel2);border:1px solid var(--edge);border-left:3px solid var(--gold);padding:10px 16px;
  border-radius:7px;pointer-events:none;transition:.22s;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- print ---------- */
#printroot{display:none}
@media print{
  @page{size:landscape;margin:.4in}
  .app,#toast{display:none!important}
  #printroot{display:block}
  body{background:#fff;overflow:visible;height:auto}
  .psheet{page-break-after:always;break-after:page}
  .psheet:last-child{page-break-after:auto;break-after:auto}
  .psheet h2{font-family:Helvetica,Arial,sans-serif;font-size:22pt;font-weight:400;color:#595959;margin:0 0 6pt}
  .psheet svg{width:100%;height:auto}
  .sheet4{display:grid;grid-template-columns:1fr 1fr;gap:14pt;page-break-after:always;break-after:page}
  .sheet4:last-child{page-break-after:auto;break-after:auto}
  .sheet4 h3{font-family:Helvetica,Arial,sans-serif;font-size:11pt;font-weight:400;color:#595959;margin:0 0 2pt}
  .sheet4 svg{width:100%;height:auto;border:.5pt solid #ccc}
}
@media (max-width:1080px){
  .app{grid-template-columns:220px 1fr 240px}
  :root{--rail:220px;--insp:240px}
  .pthumb{display:none}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .rail{border-right:0;border-bottom:1px solid var(--edge);max-height:34vh}
  .insp{border-left:0;border-top:1px solid var(--edge);max-height:38vh}
  .brand{padding:11px 12px 9px}
}
</style>
</head>
<body>

<div class="app">
  <!-- ============ RAIL ============ -->
  <aside class="rail">
    <div class="brand">
      <h1>Jr Canes <em>Red</em> 7/8</h1>
      <p id="brandsub">Installment 1 · 16 plays</p>
    </div>
    <div class="railhd">
      <span>Plays</span>
      <div style="display:flex;gap:5px">
        <button class="mini" id="btnNew" title="Add a blank play">+ Play</button>
      </div>
    </div>
    <div class="plist" id="plist"></div>
  </aside>

  <!-- ============ STAGE ============ -->
  <div class="stage">
    <div class="bar">
      <input class="namein" id="pname" placeholder="Play name" spellcheck="false">
      <div class="sep"></div>

      <div class="menu">
        <button class="tbtn" id="btnAdd">Add ▾</button>
        <div class="pop" id="popAdd" hidden>
          <button data-role="qb"><i class="dot" style="border-color:#B08709;background:#FFED94"></i>Quarterback</button>
          <button data-role="fb"><i class="dot" style="border-color:#CC5E05;background:#FCBD78"></i>Fullback / Halfback</button>
          <button data-role="wing"><i class="dot" style="border-color:#1C4FB3;background:#C7DBF7"></i>Wingback</button>
          <button data-role="wr"><i class="dot" style="border-color:#1C8230;background:#C7EBC7"></i>Receiver</button>
          <button data-role="line"><i class="dot" style="border-color:#595959;background:#EEE"></i>Lineman</button>
          <button data-role="center"><i class="dot sq" style="border-color:#595959;background:#EEE"></i>Center</button>
          <hr>
          <button data-def="LB">Defender label</button>
          <button data-def="1">Read number</button>
        </div>
      </div>

      <button class="tbtn" id="btnMirror" title="Flip this play left ↔ right">⇄ Mirror</button>
      <div class="sep"></div>
      <button class="tbtn" id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
      <button class="tbtn" id="btnRedo" title="Redo (Ctrl+Shift+Z)">↷</button>

      <div class="grow"></div>

      <button class="tbtn" id="btnGuide" title="Show line of scrimmage guide">Guides</button>
      <div class="menu">
        <button class="tbtn hot" id="btnPrint">Print ▾</button>
        <div class="pop right" id="popPrint" hidden>
          <button data-print="one">This play — full page</button>
          <button data-print="all">All plays — one per page</button>
          <button data-print="four">Call sheet — 4 per page</button>
        </div>
      </div>
      <div class="menu">
        <button class="tbtn" id="btnFile">File ▾</button>
        <div class="pop right" id="popFile" hidden>
          <button data-file="export">Save playbook file (.json)</button>
          <button data-file="import">Open playbook file…</button>
          <hr>
          <button data-file="dup">Duplicate this play</button>
          <button data-file="mirrorcopy">Add mirrored copy</button>
          <button data-file="del">Delete this play</button>
          <hr>
          <button data-file="reset">Reset to original 16 plays</button>
        </div>
      </div>
    </div>

    <div class="wrap">
      <svg class="field" id="field" viewBox="0 0 720 405" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div class="hint">
      <span><b>Drag</b> a player to move them</span>
      <span><b>Click</b> to select, then edit on the right</span>
      <span><b>Drag the gold dots</b> to bend a route</span>
      <span><b>Double-click a route</b> to add a bend</span>
      <span><b>Delete</b> removes the selection</span>
    </div>
  </div>

  <!-- ============ INSPECTOR ============ -->
  <aside class="insp">
    <div class="insphd" id="insphd">Nothing selected</div>
    <div class="inspbody" id="inspbody"></div>
  </aside>
</div>

<div id="printroot"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

/* ==================================================================
   Roles, colors, geometry
   ================================================================== */
const ROLES = {
  qb:     {name:"Quarterback",  fill:"#FFED94", line:"#B08709", shape:"e"},
  fb:     {name:"Fullback",     fill:"#FCBD78", line:"#CC5E05", shape:"e"},
  wing:   {name:"Wingback",     fill:"#C7DBF7", line:"#1C4FB3", shape:"e"},
  wr:     {name:"Receiver",     fill:"#C7EBC7", line:"#1C8230", shape:"e"},
  line:   {name:"Lineman",      fill:"#EEEEEE", line:"#595959", shape:"e"},
  center: {name:"Center",       fill:"#EEEEEE", line:"#595959", shape:"r"}
};
const RX = 18.2, RY = 15.8;          // player ellipse radii (from the original book)
const W = 720, H = 405;
const DEFGRAY = "#595959";

/* ==================================================================
   State
   ================================================================== */
let state = null;        // {plays:[...], cur:0}
let sel   = null;        // {kind:'o'|'d', i:int} index into current play
let undoStack = [], redoStack = [];
let showGuides = false;
let uidC = 1;
const uid = () => "x" + (uidC++) + Date.now().toString(36).slice(-3);

function curPlay(){ return state.plays[state.cur]; }

function swapLR(s){
  return s.replace(/\b(Left|Right|LEFT|RIGHT|left|right)\b/g, m =>
    ({Left:"Right",Right:"Left",LEFT:"RIGHT",RIGHT:"LEFT",left:"right",right:"left"})[m]);
}

function mirrorPlay(p, newName){
  return {
    id: uid(),
    name: newName !== undefined ? newName : swapLR(p.name),
    o: p.o.map(pl => ({
      id: uid(), r: pl.r, x: r1(W - pl.x), y: pl.y, label: pl.label || "",
      rt: pl.rt.map(rt => ({s: rt.s, p: rt.p.map(([x,y]) => [r1(W-x), y])}))
    })),
    d: p.d.map(d => ({id: uid(), t: d.t, x: r1(W - d.x), y: d.y})),
    link: null
  };
}
const r1 = n => Math.round(n*10)/10;

function seedState(){
  const plays = SEED.map(s => ({
    id: uid(), name: s.n,
    o: s.o.map(pl => ({id: uid(), r: pl.r, x: pl.x, y: pl.y, label:"", rt: pl.rt.map(rt=>({s:rt.s,p:rt.p.map(q=>q.slice())}))})),
    d: s.d.map(d => ({id: uid(), t: d.t, x: d.x, y: d.y})),
    link: null
  }));
  // The original book is built in Left/Right pairs — keep them linked.
  for (let i = 0; i + 1 < plays.length; i += 2){
    plays[i].link   = {partner: plays[i+1].id, auto: true, lead: true};
    plays[i+1].link = {partner: plays[i].id,   auto: true, lead: false};
  }
  return {plays, cur: 0};
}

/* ==================================================================
   Persistence
   ================================================================== */
const KEY = "jrcanes_playbook_v1";
let saveTimer = null;

function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const json = JSON.stringify(state);
    try { if (window.storage) { await window.storage.set(KEY, json); return; } } catch(e){}
    try { window.localStorage.setItem(KEY, json); } catch(e){}
  }, 500);
}

async function restore(){
  const ok = d => (d && Array.isArray(d.plays) && d.plays.length) ? d : null;
  try { if (window.storage) return ok(JSON.parse((await window.storage.get(KEY)).value)); } catch(e){}
  try { return ok(JSON.parse(window.localStorage.getItem(KEY))); } catch(e){}
  return null;
}

/* ==================================================================
   Undo
   ================================================================== */
function snap(){
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 60) undoStack.shift();
  redoStack.length = 0;
}
function undo(){
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(state));
  state = JSON.parse(undoStack.pop());
  sel = null; renderAll(); save();
}
function redo(){
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(state));
  state = JSON.parse(redoStack.pop());
  sel = null; renderAll(); save();
}

/* ==================================================================
   Geometry helpers
   ================================================================== */
function unit(ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, m=Math.hypot(dx,dy)||1;
  return [dx/m, dy/m];
}
function arrowHead(pts){
  const n = pts.length;
  const [ux,uy] = unit(pts[n-2][0],pts[n-2][1],pts[n-1][0],pts[n-1][1]);
  const [ex,ey] = pts[n-1];
  const bx = ex-ux*11, by = ey-uy*11;
  const px = -uy*5.2, py = ux*5.2;
  return `${ex},${ey} ${bx+px},${by+py} ${bx-px},${by-py}`;
}
function blockBar(pts){
  const n = pts.length;
  const [ux,uy] = unit(pts[n-2][0],pts[n-2][1],pts[n-1][0],pts[n-1][1]);
  const [ex,ey] = pts[n-1];
  const px = -uy*8, py = ux*8;
  return [[ex+px,ey+py],[ex-px,ey-py]];
}
// shorten the last segment so the line doesn't poke through the arrowhead
function bodyPts(pts, style){
  const c = pts.map(p=>p.slice());
  if (style === "arrow" && c.length >= 2){
    const n=c.length, [ux,uy]=unit(c[n-2][0],c[n-2][1],c[n-1][0],c[n-1][1]);
    c[n-1] = [c[n-1][0]-ux*7, c[n-1][1]-uy*7];
  }
  return c;
}
const pathD = pts => pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");

/* ==================================================================
   Renderer  — one function used for the editor, thumbnails and print
   ================================================================== */
function renderPlay(play, opt){
  opt = opt || {};
  const interactive = !!opt.interactive;
  const g = [];

  if (opt.guides){
    g.push(`<line class="guide" x1="40" y1="178" x2="680" y2="178"/>`);
  }

  // defenders (text labels)
  play.d.forEach((d,i) => {
    const on = interactive && sel && sel.kind==="d" && sel.i===i;
    g.push(`<g class="dlabel" ${interactive?`data-k="d" data-i="${i}"`:""}>`);
    if (on) g.push(`<rect class="sel-ring" x="${d.x-16}" y="${d.y-13}" width="32" height="26" rx="5"/>`);
    g.push(`<text x="${d.x}" y="${d.y}" text-anchor="middle" dominant-baseline="central"
      font-family="Helvetica,Arial,sans-serif" font-size="17" fill="${DEFGRAY}">${esc(d.t)}</text>`);
    if (interactive) g.push(`<rect x="${d.x-16}" y="${d.y-13}" width="32" height="26" fill="transparent"/>`);
    g.push(`</g>`);
  });

  // routes (under the players)
  play.o.forEach((pl,i) => {
    const col = ROLES[pl.r] ? ROLES[pl.r].line : DEFGRAY;
    pl.rt.forEach((rt,j) => {
      if (rt.p.length < 2) return;
      const wd = pl.r === "fb" ? 2.6 : 1.7;
      const dash = rt.s === "motion" ? ` stroke-dasharray="7 5"` : "";
      g.push(`<path d="${pathD(bodyPts(rt.p, rt.s==="block"?"block":"arrow"))}" fill="none"
        stroke="${col}" stroke-width="${wd}" stroke-linecap="round" stroke-linejoin="round"${dash}/>`);
      if (rt.s === "block"){
        const [a,b] = blockBar(rt.p);
        g.push(`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"
          stroke="${col}" stroke-width="2.4" stroke-linecap="round"/>`);
      } else {
        g.push(`<polygon points="${arrowHead(rt.p)}" fill="${col}"/>`);
      }
      if (interactive){
        g.push(`<path class="hit" d="${pathD(rt.p)}" data-k="rt" data-i="${i}" data-j="${j}"/>`);
      }
    });
  });

  // players
  play.o.forEach((pl,i) => {
    const R = ROLES[pl.r] || ROLES.line;
    const on = interactive && sel && sel.kind==="o" && sel.i===i;
    g.push(`<g class="o-body" ${interactive?`data-k="o" data-i="${i}"`:""}>`);
    if (on){
      g.push(R.shape === "r"
        ? `<rect class="sel-ring" x="${pl.x-RX-5}" y="${pl.y-RY-5}" width="${(RX+5)*2}" height="${(RY+5)*2}" rx="6"/>`
        : `<ellipse class="sel-ring" cx="${pl.x}" cy="${pl.y}" rx="${RX+5}" ry="${RY+5}"/>`);
    }
    g.push(R.shape === "r"
      ? `<rect x="${pl.x-RX*0.87}" y="${pl.y-RY*0.93}" width="${RX*1.74}" height="${RY*1.86}" rx="1"
           fill="${R.fill}" stroke="${R.line}" stroke-width="1.2"/>`
      : `<ellipse cx="${pl.x}" cy="${pl.y}" rx="${RX}" ry="${RY}" fill="${R.fill}" stroke="${R.line}" stroke-width="1.2"/>`);
    if (pl.label){
      g.push(`<text x="${pl.x}" y="${pl.y}" text-anchor="middle" dominant-baseline="central"
        font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="${R.line}"
        pointer-events="none">${esc(pl.label)}</text>`);
    }
    g.push(`</g>`);
  });

  // route handles for the selected player (drawn last so they sit on top)
  if (interactive && sel && sel.kind === "o"){
    const pl = play.o[sel.i];
    if (pl) pl.rt.forEach((rt,j) => rt.p.forEach((pt,k) =>
      g.push(`<circle class="handle" cx="${pt[0]}" cy="${pt[1]}" r="5.5" data-k="h" data-i="${sel.i}" data-j="${j}" data-p="${k}"/>`)
    ));
  }

  return g.join("\n");
}
const esc = s => String(s).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

function renderInsp(){
  const hd = $("insphd"), bd = $("inspbody"), p = curPlay();
  const partner = p.link ? state.plays.find(q => q.id === p.link.partner) : null;

  const linkHTML = partner ? `<div class="linkbox">
      Mirrored pair with <b>${esc(partner.name)}</b>.
      ${p.link.auto ? "Edits here update it automatically." : "Automatic updating is off."}
      <span class="acts">
        <button class="mini" data-act="togglelink">${p.link.auto?"Turn off":"Turn on"}</button>
        <button class="mini" data-act="syncnow">Update it now</button>
        <button class="mini dang" data-act="unlink">Unpair</button>
      </span>
    </div>` : "";

  if (!sel){
    hd.textContent = "Play";
    bd.innerHTML = linkHTML + `<p class="empty">Click a player or a defender on the field to edit them.<br><br>
      Use <b>Add</b> to put someone new on the field, or <b>Mirror</b> to flip the whole play.</p>`;
    wireInsp(); return;
  }

  if (sel.kind === "d"){
    const d = p.d[sel.i];
    if (!d){ sel=null; return renderInsp(); }
    hd.textContent = "Defender";
    bd.innerHTML = linkHTML + `
      <div class="fld"><label>Label</label>
        <input class="inp" id="dtext" value="${esc(d.t)}" maxlength="4" spellcheck="false"></div>
      <div class="fld"><label>Quick set</label>
        <div class="seg">${["DE","DT","LB","CB","S"].map(t=>
          `<button data-act="dquick" data-v="${t}" class="${d.t===t?"on":""}">${t}</button>`).join("")}</div></div>
      <div class="fld"><label>Read order</label>
        <div class="seg">${["1","2","3"].map(t=>
          `<button data-act="dquick" data-v="${t}" class="${d.t===t?"on":""}">${t}</button>`).join("")}</div></div>
      <button class="mini dang wide" data-act="delsel">Remove defender</button>`;
    wireInsp(); return;
  }

  const pl = p.o[sel.i];
  if (!pl){ sel=null; return renderInsp(); }
  const R = ROLES[pl.r] || ROLES.line;
  hd.textContent = R.name;
  bd.innerHTML = linkHTML + `
    <div class="fld"><label>Position</label>
      <select class="inp" id="orole">${Object.entries(ROLES).map(([k,v])=>
        `<option value="${k}" ${k===pl.r?"selected":""}>${v.name}</option>`).join("")}</select></div>
    <div class="fld"><label>Letter inside (optional)</label>
      <input class="inp" id="olabel" value="${esc(pl.label||"")}" maxlength="2" spellcheck="false" placeholder="e.g. C, X, Y"></div>

    <div class="fld"><label>Assignments</label>
      ${pl.rt.length ? pl.rt.map((rt,j)=>`
        <div class="rt">
          <div class="rthd"><em>${rt.p.length} point${rt.p.length===1?"":"s"}</em>
            <button class="mini dang" data-act="delrt" data-j="${j}">Remove</button></div>
          <div class="seg" style="margin-bottom:8px">
            <button data-act="rtstyle" data-j="${j}" data-v="arrow"  class="${rt.s==="arrow"?"on":""}">→<span>Run</span></button>
            <button data-act="rtstyle" data-j="${j}" data-v="block"  class="${rt.s==="block"?"on":""}">┬<span>Block</span></button>
            <button data-act="rtstyle" data-j="${j}" data-v="motion" class="${rt.s==="motion"?"on":""}">⇢<span>Motion</span></button>
          </div>
          <button class="mini wide" data-act="addpt" data-j="${j}">Add a bend</button>
        </div>`).join("")
        : `<p class="empty" style="margin:0 0 9px">No assignment drawn yet.</p>`}
      <button class="mini wide" data-act="addrt">+ Draw an assignment</button>
    </div>

    <button class="mini dang wide" data-act="delsel">Remove player</button>`;
  wireInsp();
}

function wireInsp(){
  const bd = $("inspbody");
  bd.querySelectorAll("[data-act]").forEach(b => b.onclick = () => inspAct(b.dataset));
  const role = $("orole");
  if (role) role.onchange = () => {
    snap(); curPlay().o[sel.i].r = role.value; syncPartner(); renderAll(); save();
  };
  const lab = $("olabel");
  if (lab) lab.oninput = () => {
    curPlay().o[sel.i].label = lab.value; syncPartner(); renderField(); renderList(); save();
  };
  const dt = $("dtext");
  if (dt) dt.oninput = () => {
    curPlay().d[sel.i].t = dt.value; syncPartner(); renderField(); renderList(); save();
  };
}

function inspAct(ds){
  const p = curPlay();
  switch(ds.act){
    case "delsel":
      snap();
      if (sel.kind === "o") p.o.splice(sel.i,1); else p.d.splice(sel.i,1);
      sel = null; break;
    case "dquick":
      snap(); p.d[sel.i].t = ds.v; break;
    case "rtstyle":
      snap(); p.o[sel.i].rt[ds.j].s = ds.v; break;
    case "delrt":
      snap(); p.o[sel.i].rt.splice(+ds.j,1); break;
    case "addpt": {
      snap();
      const rt = p.o[sel.i].rt[ds.j], n = rt.p.length;
      const a = rt.p[n-2], b = rt.p[n-1];
      rt.p.splice(n-1, 0, [r1((a[0]+b[0])/2), r1((a[1]+b[1])/2)]);
      break;
    }
    case "addrt": {
      snap();
      const pl = p.o[sel.i];
      pl.rt.push({s:"arrow", p:[[r1(pl.x), r1(pl.y-RY-3)], [r1(pl.x), r1(pl.y-RY-70)]]});
      break;
    }
    case "togglelink": snap(); p.link.auto = !p.link.auto; break;
    case "syncnow":    snap(); syncPartner(true); break;
    case "unlink": {
      snap();
      const q = state.plays.find(x => x.id === p.link.partner);
      if (q) q.link = null;
      p.link = null; break;
    }
  }
  syncPartner(); renderAll(); save();
}

/* ==================================================================
   Mirror pair syncing
   ================================================================== */
function syncPartner(force){
  const p = curPlay();
  if (!p.link || (!p.link.auto && !force)) return;
  const idx = state.plays.findIndex(q => q.id === p.link.partner);
  if (idx < 0) return;
  const keepLink = state.plays[idx].link;
  const m = mirrorPlay(p);
  m.id = state.plays[idx].id;
  m.link = keepLink;
  state.plays[idx] = m;
}

/* ==================================================================
   Canvas interaction
   ================================================================== */
let drag = null;
function svgPt(evt){
  const r = field.getBoundingClientRect();
  return [ (evt.clientX - r.left) / r.width  * W,
           (evt.clientY - r.top)  / r.height * H ];
}

field.addEventListener("pointerdown", e => {
  const t = e.target.closest("[data-k]");
  if (!t){ sel = null; renderAll(); return; }
  const k = t.dataset.k;
  const [mx,my] = svgPt(e);

  if (k === "h"){
    sel = {kind:"o", i:+t.dataset.i};
    snap();
    drag = {mode:"pt", i:+t.dataset.i, j:+t.dataset.j, p:+t.dataset.p};
  } else if (k === "o"){
    sel = {kind:"o", i:+t.dataset.i};
    snap();
    const pl = curPlay().o[sel.i];
    drag = {mode:"player", i:sel.i, ox:mx-pl.x, oy:my-pl.y, moved:false};
  } else if (k === "d"){
    sel = {kind:"d", i:+t.dataset.i};
    snap();
    const d = curPlay().d[sel.i];
    drag = {mode:"def", i:sel.i, ox:mx-d.x, oy:my-d.y};
  } else if (k === "rt"){
    sel = {kind:"o", i:+t.dataset.i};
  }
  try { field.setPointerCapture(e.pointerId); } catch(err){}
  document.body.classList.add("dragging");
  renderAll();
});

field.addEventListener("pointermove", e => {
  if (!drag) return;
  const [mx,my] = svgPt(e);
  const p = curPlay();
  if (drag.mode === "player"){
    const pl = p.o[drag.i];
    const nx = clamp(r1(mx-drag.ox), 20, W-20), ny = clamp(r1(my-drag.oy), 20, H-20);
    const dx = nx-pl.x, dy = ny-pl.y;
    pl.x = nx; pl.y = ny;
    pl.rt.forEach(rt => rt.p = rt.p.map(([x,y]) => [r1(x+dx), r1(y+dy)]));
  } else if (drag.mode === "pt"){
    p.o[drag.i].rt[drag.j].p[drag.p] = [clamp(r1(mx),4,W-4), clamp(r1(my),4,H-4)];
  } else if (drag.mode === "def"){
    const d = p.d[drag.i];
    d.x = clamp(r1(mx-drag.ox),12,W-12); d.y = clamp(r1(my-drag.oy),12,H-12);
  }
  renderField();
});

function endDrag(){
  if (!drag) return;
  drag = null;
  document.body.classList.remove("dragging");
  syncPartner(); renderAll(); save();
}
field.addEventListener("pointerup", endDrag);
field.addEventListener("pointercancel", endDrag);
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));

// double-click a route to add a bend at that spot
field.addEventListener("dblclick", e => {
  const t = e.target.closest('[data-k="rt"]');
  if (!t) return;
  snap();
  const [mx,my] = svgPt(e);
  const rt = curPlay().o[+t.dataset.i].rt[+t.dataset.j];
  let best = 1, bd = Infinity;
  for (let i=1;i<rt.p.length;i++){
    const d = distSeg([mx,my], rt.p[i-1], rt.p[i]);
    if (d < bd){ bd = d; best = i; }
  }
  rt.p.splice(best, 0, [r1(mx), r1(my)]);
  sel = {kind:"o", i:+t.dataset.i};
  syncPartner(); renderAll(); save();
});
function distSeg(p,a,b){
  const dx=b[0]-a[0], dy=b[1]-a[1], L=dx*dx+dy*dy || 1;
  let t = ((p[0]-a[0])*dx + (p[1]-a[1])*dy)/L; t = clamp(t,0,1);
  return Math.hypot(p[0]-(a[0]+t*dx), p[1]-(a[1]+t*dy));
}

  };

$("popAdd").addEventListener("click", e => {

$("popFile").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  $("popFile").hidden = true;
  const p = curPlay();
  switch(b.dataset.file){
    case "export": {
      const blob = new Blob([JSON.stringify(state,null,1)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "jr-canes-red-78-playbook.json";
      a.click(); URL.revokeObjectURL(a.href);
      toast("Playbook file saved"); break;
    }
    case "import": $("fileIn").click(); break;
    case "dup": {
      snap();
      const c = JSON.parse(JSON.stringify(p));
      c.id = uid(); c.link = null; c.name = p.name + " (copy)";
      c.o.forEach(x => x.id = uid()); c.d.forEach(x => x.id = uid());
      state.plays.splice(state.cur+1, 0, c);
      state.cur++; sel = null; renderAll(); save(); break;
    }
    case "mirrorcopy": {
      snap();
      const m = mirrorPlay(p);
      m.link = {partner:p.id, auto:true, lead:false};
      p.link = {partner:m.id, auto:true, lead:true};
      state.plays.splice(state.cur+1, 0, m);
      state.cur++; sel = null; renderAll(); save();
      toast("Mirrored copy added and linked"); break;
    }
    case "del": {
      if (state.plays.length === 1){ toast("A playbook needs at least one play"); return; }
      if (!confirm(`Delete "${p.name}"?`)) return;
      snap();
      if (p.link){
        const q = state.plays.find(x => x.id === p.link.partner);
        if (q) q.link = null;
      }
      state.plays.splice(state.cur,1);
      state.cur = Math.min(state.cur, state.plays.length-1);
      sel = null; renderAll(); save(); break;
    }
    case "reset":
      if (!confirm("Replace everything with the original 16 plays? Your changes will be lost.")) return;
      snap(); state = seedState(); sel = null; renderAll(); save();
      toast("Back to the original 16"); break;
  }
});

$("fileIn").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || !Array.isArray(d.plays) || !d.plays.length) throw 0;
      snap(); state = d; state.cur = 0; sel = null; renderAll(); save();
      toast(`Opened ${d.plays.length} plays`);
    } catch(err){ toast("That file isn't a playbook this editor can read"); }
  };
  rd.readAsText(f);
  e.target.value = "";
};

$("popPrint").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  $("popPrint").hidden = true;
  const root = $("printroot");
  const mode = b.dataset.print;
  const sheet = p => `<h2>${esc(p.name)}</h2><svg viewBox="0 0 720 405" xmlns="http://www.w3.org/2000/svg">${renderPlay(p,{})}</svg>`;

  if (mode === "one"){
    root.innerHTML = `<div class="psheet">${sheet(curPlay())}</div>`;
  } else if (mode === "all"){
    root.innerHTML = state.plays.map(p => `<div class="psheet">${sheet(p)}</div>`).join("");
  } else {
    let html = "";
    for (let i=0;i<state.plays.length;i+=4){
      html += `<div class="sheet4">` + state.plays.slice(i,i+4).map(p =>
        `<div><h3>${esc(p.name)}</h3><svg viewBox="0 0 720 405" xmlns="http://www.w3.org/2000/svg">${renderPlay(p,{})}</svg></div>`
      ).join("") + `</div>`;
    }
    root.innerHTML = html;
  }
  setTimeout(() => window.print(), 60);
});

/* ==================================================================
   Keyboard
   ================================================================== */
document.addEventListener("keydown", e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(e.target.tagName);
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="z"){
    e.preventDefault(); e.shiftKey ? redo() : undo(); return;
  }
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="p"){
    e.preventDefault();
    $("printroot").innerHTML = `<div class="psheet"><h2>${esc(curPlay().name)}</h2>
      <svg viewBox="0 0 720 405" xmlns="http://www.w3.org/2000/svg">${renderPlay(curPlay(),{})}</svg></div>`;
    setTimeout(()=>window.print(),60); return;
  }
  if (typing) return;
  if ((e.key==="Delete"||e.key==="Backspace") && sel){ e.preventDefault(); inspAct({act:"delsel"}); }
  if (e.key==="ArrowDown"){ e.preventDefault(); state.cur=Math.min(state.cur+1,state.plays.length-1); sel=null; renderAll(); }
  if (e.key==="ArrowUp"){   e.preventDefault(); state.cur=Math.max(state.cur-1,0); sel=null; renderAll(); }
  if (e.key==="Escape"){ sel=null; renderAll(); }
});

/* ==================================================================
   Toast + boot
   ================================================================== */
let tT;
function toast(msg){
  const el = $("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(tT); tT = setTimeout(()=>el.classList.remove("on"), 2200);
}

(async function boot(){
  state = (await restore()) || seedState();
  if (state.cur == null || state.cur >= state.plays.length) state.cur = 0;
  renderAll();
})();
</script>
